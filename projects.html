  <main class="min-h-screen pt-32 pb-24 bg-slate-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Header -->
      <div class="mb-16">
        <h1 class="text-5xl font-black text-slate-900 mb-6 tracking-tight animate-fade-up">Featured Projects</h1>
        <p class="text-xl text-slate-500 max-w-2xl leading-relaxed animate-fade-up stagger-1">
          A selection of projects I've built, ranging from complex web applications to mobile tools and experimental designs.
        </p>
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap gap-3 mb-12 animate-fade-up stagger-2" id="filters">
        <button class="filter-btn active-filter px-7 py-2.5 rounded-full text-sm font-bold transition-all duration-300 border hover:scale-105 active:scale-95 bg-slate-900 text-white border-slate-900 shadow-lg shadow-slate-900/20" data-filter="All">All</button>
        <button class="filter-btn px-7 py-2.5 rounded-full text-sm font-bold transition-all duration-300 border hover:scale-105 active:scale-95 bg-white text-slate-500 border-slate-200 hover:border-blue-200 hover:text-blue-600" data-filter="Web App">Web App</button>
        <button class="filter-btn px-7 py-2.5 rounded-full text-sm font-bold transition-all duration-300 border hover:scale-105 active:scale-95 bg-white text-slate-500 border-slate-200 hover:border-blue-200 hover:text-blue-600" data-filter="Mobile">Mobile</button>
        <button class="filter-btn px-7 py-2.5 rounded-full text-sm font-bold transition-all duration-300 border hover:scale-105 active:scale-95 bg-white text-slate-500 border-slate-200 hover:border-blue-200 hover:text-blue-600" data-filter="Design">Design</button>
        <button class="filter-btn px-7 py-2.5 rounded-full text-sm font-bold transition-all duration-300 border hover:scale-105 active:scale-95 bg-white text-slate-500 border-slate-200 hover:border-blue-200 hover:text-blue-600" data-filter="React">React</button>
      </div>

      <!-- Grid -->
      <div id="projects-grid" class="project-grid grid md:grid-cols-2 lg:grid-cols-3 gap-8 mb-20">
        <!-- Rendered by JS -->
      </div>

      <!-- Load more -->
      <div class="flex flex-col items-center animate-on-scroll">
        <button class="flex items-center gap-2 text-slate-500 font-semibold hover:text-slate-900 transition-colors hover:gap-3 duration-200">
          Load more projects
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-50 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6 pt-12 border-t border-slate-200">
        <p class="text-sm text-slate-400">&copy; <span id="current-year"></span> Trung Hieu Dinh. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="data/profile.js"></script>
  <script src="data/projects.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-year').textContent = new Date().getFullYear();

      const grid = document.getElementById('projects-grid');
      const filterBtns = document.querySelectorAll('.filter-btn');

      const activeClasses = ['bg-slate-900', 'text-white', 'border-slate-900', 'shadow-lg', 'shadow-slate-900/20'];
      const inactiveClasses = ['bg-white', 'text-slate-500', 'border-slate-200', 'hover:border-blue-200', 'hover:text-blue-600'];

      function renderProjects(filter) {
        grid.classList.add('animating');
        
        setTimeout(() => {
          grid.innerHTML = '';
          const filtered = filter === 'All' 
            ? PROJECTS 
            : PROJECTS.filter(p => {
                if (filter === 'Web App') return p.category === 'web';
                // Check if category matches exactly, or if tags include the filter
                if (p.category.toLowerCase() === filter.toLowerCase()) return true;
                if (p.tags && p.tags.some(t => t.toLowerCase() === filter.toLowerCase())) return true;
                return false;
              });
            
          filtered.forEach((p, index) => {
            grid.innerHTML += window.renderProjectCard(p, index);
          });
          
          grid.classList.remove('animating');
          
          // Re-trigger observer for new elements
          setTimeout(() => {
            const observer = new IntersectionObserver((entries) => {
              entries.forEach(entry => {
                if(entry.isIntersecting) {
                  entry.target.classList.add('is-visible');
                  observer.unobserve(entry.target);
                }
              });
            }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });
            
            grid.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));
            
            // Re-bind 3D cards
            grid.querySelectorAll('.card-3d').forEach(card => {
              card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.transform = `perspective(1000px) rotateX(${((y - rect.height / 2) / rect.height) * -6}deg) rotateY(${((x - rect.width / 2) / rect.width) * 6}deg) translateY(-6px)`;
                card.style.boxShadow = `0 20px 60px rgba(0,0,0,0.1)`;
              });
              card.addEventListener('mouseleave', () => {
                card.style.transform = '';
                card.style.boxShadow = '';
              });
            });
          }, 50);

        }, 200);
      }

      // Initial render
      renderProjects('All');

      // Filter logic
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          // Reset all buttons
          filterBtns.forEach(b => {
            b.classList.remove(...activeClasses, 'active-filter');
            b.classList.add(...inactiveClasses);
          });
          // Set active button
          btn.classList.remove(...inactiveClasses);
          btn.classList.add(...activeClasses, 'active-filter');
          
          renderProjects(btn.getAttribute('data-filter'));
        });
      });
    });
  </script>
</body>
</html>
