    <main class="min-h-screen pt-24 pb-16 md:pt-32 md:pb-24 bg-slate-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <!-- Header -->
            <div class="mb-16">
                <h1 class="text-5xl font-black text-slate-900 mb-6 tracking-tight animate-fade-up">Featured Projects
                </h1>
                <p class="text-xl text-slate-500 max-w-2xl leading-relaxed animate-fade-up stagger-1">
                    A selection of projects I've built, ranging from complex web applications to mobile tools and
                    experimental designs.
                </p>
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap gap-3 mb-12 animate-fade-up stagger-2" id="filters">
                <button
                    class="filter-btn active-filter px-7 py-2.5 rounded-full text-sm font-bold transition-all duration-300 border hover:scale-105 active:scale-95 bg-slate-900 text-white border-slate-900 shadow-lg shadow-slate-900/20"
                    data-filter="All">All</button>
                <button
                    class="filter-btn px-7 py-2.5 rounded-full text-sm font-bold transition-all duration-300 border hover:scale-105 active:scale-95 bg-white text-slate-500 border-slate-200 hover:border-blue-200 hover:text-blue-600"
                    data-filter="Web App">Web App</button>
                <button
                    class="filter-btn px-7 py-2.5 rounded-full text-sm font-bold transition-all duration-300 border hover:scale-105 active:scale-95 bg-white text-slate-500 border-slate-200 hover:border-blue-200 hover:text-blue-600"
                    data-filter="Mobile">Mobile</button>
            </div>

            <!-- Grid -->
            <div id="projects-grid" class="project-grid grid md:grid-cols-2 lg:grid-cols-3 gap-8 mb-20">
                <!-- Rendered by JS -->
            </div>

            <!-- Load more -->
            <div id="load-more-wrapper" class="flex flex-col items-center animate-on-scroll" style="display: none;">
                <button id="load-more-btn"
                    class="flex items-center gap-2 text-slate-500 font-semibold hover:text-slate-900 transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed">
                    <!-- Spinner (ẩn mặc định) -->
                    <svg id="load-more-spinner" class="hidden h-5 w-5 animate-spin text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <!-- Text bình thường -->
                    <span id="load-more-text">Load more projects</span>
                    <!-- Arrow (ẩn khi loading) -->
                    <svg id="load-more-arrow" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-50 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6 pt-12 border-t border-slate-200">
                <p class="text-sm text-slate-400">&copy; <span id="current-year"></span> Trung Hieu Dinh. All rights
                    reserved.</p>
            </div>
        </div>
    </footer>

    <script src="data/profile.js?v=3"></script>
    <script src="data/projects.js?v=3"></script>
    <script src="assets/js/main.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('current-year').textContent = new Date().getFullYear();

            const grid = document.getElementById('projects-grid');
            const filterBtns = document.querySelectorAll('.filter-btn');

            const activeClasses = ['bg-slate-900', 'text-white', 'border-slate-900', 'shadow-lg', 'shadow-slate-900/20'];
            const inactiveClasses = ['bg-white', 'text-slate-500', 'border-slate-200', 'hover:border-blue-200', 'hover:text-blue-600'];

            let currentFilter = 'All';
            let visibleCount = 6;
            let currentFilteredProjects = [];

            function renderProjects(filter, resetCount = true) {
                if (resetCount) {
                    currentFilter = filter;
                    visibleCount = 6;
                    grid.classList.add('animating');
                }

                // Tính filtered list
                currentFilteredProjects = filter === 'All'
                    ? PROJECTS
                    : PROJECTS.filter(p => {
                        if (filter === 'Web App') return p.category === 'web';
                        if (p.category.toLowerCase() === filter.toLowerCase()) return true;
                        if (p.tags && p.tags.some(t => t.toLowerCase() === filter.toLowerCase())) return true;
                        return false;
                    });

                const loadMoreWrapper = document.getElementById('load-more-wrapper');

                if (resetCount) {
                    // Filter thay đổi → xóa grid và render lại toàn bộ có delay/animation
                    setTimeout(() => {
                        grid.innerHTML = '';
                        const projectsToShow = currentFilteredProjects.slice(0, visibleCount);
                        projectsToShow.forEach((p, index) => {
                            grid.innerHTML += window.renderProjectCard(p, index);
                        });

                        if (loadMoreWrapper) {
                            loadMoreWrapper.style.display = visibleCount >= currentFilteredProjects.length ? 'none' : 'flex';
                        }

                        grid.classList.remove('animating');
                        bindNewCards(grid.querySelectorAll('.animate-on-scroll'), grid.querySelectorAll('.card-3d'), true);
                    }, 200);
                } else {
                    // Load More → chỉ append thêm các card mới, không xóa grid
                    const prevCount = visibleCount - 6; // số card đã có trước đó
                    const newProjects = currentFilteredProjects.slice(prevCount, visibleCount);

                    const newCardEls = [];
                    newProjects.forEach((p, i) => {
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = window.renderProjectCard(p, prevCount + i);
                        const cardEl = wrapper.firstElementChild;
                        grid.appendChild(cardEl);
                        newCardEls.push(cardEl);
                    });

                    if (loadMoreWrapper) {
                        loadMoreWrapper.style.display = visibleCount >= currentFilteredProjects.length ? 'none' : 'flex';
                    }

                    // Bind animation và 3D cho card mới
                    const newScrollEls = newCardEls.flatMap(el => [...el.querySelectorAll('.animate-on-scroll'), ...(el.classList.contains('animate-on-scroll') ? [el] : [])]);
                    const new3DCards = newCardEls.flatMap(el => [...el.querySelectorAll('.card-3d'), ...(el.classList.contains('card-3d') ? [el] : [])]);
                    bindNewCards(newScrollEls, new3DCards);
                }
            }

            // instant=true: hiện ngay khi load/filter; instant=false: dùng scroll observer (Load More)
            function bindNewCards(scrollEls, cards3d, instant = false) {
                setTimeout(() => {
                    if (instant) {
                        // Hiện ngay lập tức với stagger delay
                        scrollEls.forEach((el, i) => {
                            setTimeout(() => {
                                el.classList.add('is-visible');
                            }, i * 80); // mỗi card cách nhau 80ms
                        });
                    } else {
                        // Load More: dùng IntersectionObserver
                        const observer = new IntersectionObserver((entries) => {
                            entries.forEach(entry => {
                                if (entry.isIntersecting) {
                                    entry.target.classList.add('is-visible');
                                    observer.unobserve(entry.target);
                                }
                            });
                        }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });

                        scrollEls.forEach(el => observer.observe(el));
                    }

                    // Bind 3D hover cho tất cả card (cả 2 mode)
                    cards3d.forEach(card => {
                        card.addEventListener('mousemove', (e) => {
                            const rect = card.getBoundingClientRect();
                            const x = e.clientX - rect.left;
                            const y = e.clientY - rect.top;
                            card.style.transform = `perspective(1000px) rotateX(${((y - rect.height / 2) / rect.height) * -6}deg) rotateY(${((x - rect.width / 2) / rect.width) * 6}deg) translateY(-6px)`;
                            card.style.boxShadow = `0 20px 60px rgba(0,0,0,0.1)`;
                        });
                        card.addEventListener('mouseleave', () => {
                            card.style.transform = '';
                            card.style.boxShadow = '';
                        });
                    });
                }, 50);
            }

            // Initial render
            renderProjects('All', true);

            // Bind Load More Button
            const loadMoreBtn = document.getElementById('load-more-btn');
            const loadMoreSpinner = document.getElementById('load-more-spinner');
            const loadMoreText = document.getElementById('load-more-text');
            const loadMoreArrow = document.getElementById('load-more-arrow');

            if (loadMoreBtn) {
                loadMoreBtn.addEventListener('click', () => {
                    // Hiện spinner, ẩn arrow, đổi text, disable button
                    loadMoreBtn.disabled = true;
                    loadMoreSpinner.classList.remove('hidden');
                    loadMoreArrow.classList.add('hidden');
                    loadMoreText.textContent = 'Loading...';

                    // Giả lập delay load để spinner hiển thị rõ
                    setTimeout(() => {
                        visibleCount += 6;
                        renderProjects(currentFilter, false);

                        // Khôi phục button sau khi render xong
                        setTimeout(() => {
                            loadMoreBtn.disabled = false;
                            loadMoreSpinner.classList.add('hidden');
                            loadMoreArrow.classList.remove('hidden');
                            loadMoreText.textContent = 'Load more projects';
                        }, 100);
                    }, 600);
                });
            }

            // Filter logic
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset all buttons
                    filterBtns.forEach(b => {
                        b.classList.remove(...activeClasses, 'active-filter');
                        b.classList.add(...inactiveClasses);
                    });
                    // Set active button
                    btn.classList.remove(...inactiveClasses);
                    btn.classList.add(...activeClasses, 'active-filter');

                    renderProjects(btn.getAttribute('data-filter'), true);
                });
            });
        });
    </script>
</body>
